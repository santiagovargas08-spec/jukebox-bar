<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Panel de Control</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <script type="module" src="/js/vendor/drag-drop-touch.esm.min.js?autoload"></script>
  
  <link rel="stylesheet" href="/css/admin.css">
</head>

<body class="admin-body" id="body-panel">

  <header class="admin-header">
    <div class="admin-header-row">
      <h1 class="admin-title">
        <span id="admin-bar-name">Jukebox</span>
        <span>CONTROL PANEL</span>
      </h1>
      <button class="btn-admin admin-logout" id="btn-logout-operator" type="button">
        Cerrar sesión
      </button>
    </div>
  </header>

  <section class="panel-section">
    <h2 class="section-title">🔊 En Pantalla Ahora</h2>
    <div id="box-reproduciendo">
      </div>
  </section>

  <section class="panel-section">
    <h2 class="section-title">💿 Agregar Canción (DJ)</h2>
    <div class="admin-search-box">
      <input type="text" id="input-buscar-admin" class="admin-input" placeholder="Buscar artista, canción...">
      <button class="btn-admin" id="btn-buscar-admin">🔍 Buscar</button>
    </div>
    <div class="admin-queue-list" id="admin-results">
      </div>
  </section>

  <section class="panel-section">
    <h2 class="section-title">📋 Lista de Espera (<span id="count-cola">0</span>)</h2>
    <div class="admin-queue-list" id="lista-cola">
      </div>
  </section>

  <section class="panel-section">
    <h2 class="section-title section-title-danger">🚨 Zona de Peligro</h2>
    <button class="btn-danger-zone" id="btn-vaciar">
      💥 Vaciar toda la fila de canciones
    </button>
  </section>

  <script src="/js/dom-safe.js"></script>
  <script src="/js/bar-loader.js?v=20260919-branding3"></script>
  <script src="/js/operator-auth.js"></script>
  <script src="/js/admin-dialog.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin.js?v=20260919-branding3"></script>
</body>
</html>
