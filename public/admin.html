<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ GENESIS 2.0 — Panel de Control</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <script type="module" src="/js/vendor/drag-drop-touch.esm.min.js?autoload"></script>
  
  <style>
    /* 🎨 Tema Cyberpunk Cian para el Administrador */
    :root {
      --neon-admin: #00f0ff; /* Neón Cian Principal */
      --neon-admin-glow: rgba(0, 240, 255, 0.5);
      --neon-danger: #ff0055; /* Rojo para acciones destructivas */
    }
    body.admin-body {
      background-color: #050508;
      font-family: 'Rajdhani', sans-serif;
      color: #fff;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .admin-header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px dashed var(--neon-admin);
      padding-bottom: 15px;
    }
    .admin-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-admin-glow);
      letter-spacing: 2px;
    }
    .admin-title span { color: var(--neon-admin); }
    
    .panel-section {
      background: rgba(15, 15, 25, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 15px;
      color: var(--neon-admin);
      text-transform: uppercase;
    }
    
    /* Canción sonando */
    .now-playing-box {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(0, 240, 255, 0.05);
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid var(--neon-admin);
    }
    .admin-thumb {
      width: 70px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }
    .track-details { flex: 1; }
    .track-title { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .track-author { color: #8a8a9e; font-size: 0.9rem; }
    
    /* Botones y Buscador */
    .btn-admin {
      background: transparent;
      border: 1px solid var(--neon-admin);
      color: #fff;
      padding: 10px 15px;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }
    .btn-admin:hover {
      background: var(--neon-admin);
      color: #000;
      box-shadow: 0 0 12px var(--neon-admin-glow);
    }
    
    /* Botones Peligrosos (Rojos) */
    .btn-danger-zone {
      background: rgba(255, 0, 85, 0.1);
      border: 1px solid var(--neon-danger);
      color: var(--neon-danger);
      width: 100%;
    }
    .btn-danger-zone:hover {
      background: var(--neon-danger);
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
    }
    .btn-delete-item {
      background: #3a0d1a;
      border: 1px solid var(--neon-danger);
      color: #ff99bb;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-delete-item:hover {
      background: var(--neon-danger);
      color: #fff;
    }

    /* Buscador Admin */
    .admin-search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .admin-input {
      flex: 1;
      padding: 10px 15px;
      background: #0a0a0f;
      border: 1px solid var(--neon-admin);
      color: #fff;
      border-radius: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      outline: none;
    }
    .admin-input:focus {
      box-shadow: 0 0 8px var(--neon-admin-glow);
    }
    
    /* Listas y Drag & Drop */
    .admin-queue-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .admin-queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #11111e;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.1);
      transition: background 0.2s ease;
    }
    
    /* ✨ Clases para Drag and Drop */
    .drag-handle {
      cursor: grab;
      font-size: 1.5rem;
      color: rgba(0, 240, 255, 0.4);
      margin-right: 15px;
      padding: 0 5px;
      user-select: none;
      touch-action: none; /* 🔥 AÑADIDO: Evita el scroll en iPhone al arrastrar */
    }
    .drag-handle:active {
      cursor: grabbing;
      color: var(--neon-admin);
    }
    .admin-queue-item.dragging {
      opacity: 0.5;
      border: 1px dashed var(--neon-admin);
      background: rgba(0, 240, 255, 0.05);
    }
    
    .empty-msg { color: #666; text-align: center; padding: 20px; }
  </style>
</head>

<body class="admin-body" id="body-panel">

  <header class="admin-header">
    <h1 class="admin-title">GENESIS 2.0<span>CONTROL PANEL</span></h1>
  </header>

  <section class="panel-section">
    <h2 class="section-title">🔊 En Pantalla Ahora</h2>
    <div id="box-reproduciendo">
      </div>
  </section>

  <section class="panel-section">
    <h2 class="section-title">💿 Agregar Canción (DJ)</h2>
    <div class="admin-search-box">
      <input type="text" id="input-buscar-admin" class="admin-input" placeholder="Buscar artista, canción...">
      <button class="btn-admin" id="btn-buscar-admin">🔍 Buscar</button>
    </div>
    <div class="admin-queue-list" id="admin-results">
      </div>
  </section>

  <section class="panel-section">
    <h2 class="section-title">📋 Lista de Espera (<span id="count-cola">0</span>)</h2>
    <div class="admin-queue-list" id="lista-cola">
      </div>
  </section>

  <section class="panel-section">
    <h2 class="section-title" style="color: var(--neon-danger);">🚨 Zona de Peligro</h2>
    <button class="btn-danger-zone" id="btn-vaciar">
      💥 Vaciar toda la fila de canciones
    </button>
  </section>

  <script src="/js/dom-safe.js"></script>
  <script src="/js/bar-loader.js"></script>
  <script src="/js/operator-auth.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
