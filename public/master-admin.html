<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jukebox Digital — Master Admin</title>
  <link rel="stylesheet" href="/css/master-admin.css">
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <h1>MASTER ADMIN</h1>
    <p class="muted">Administración central de todos los bares.</p>
    <form id="loginForm" class="form-grid">
      <label>Correo<input id="email" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
      <div class="actions actions-end"><button>Entrar</button></div>
    </form>
    <p id="loginError" class="error"></p>
  </div>

  <main id="app" class="hidden">
    <div class="row row-space-between"><div><h1>MASTER ADMIN</h1><p id="who" class="muted"></p></div><button id="logout" class="secondary">Cerrar sesión</button></div>
    <section class="card"><h2>Resumen</h2><div id="stats" class="grid"></div></section>
    <section class="card">
      <h2>Crear bar</h2>
      <form id="createForm" class="form-grid">
        <label>Nombre del bar *<input id="barName" required placeholder="La Esquina Bar"></label>
        <label>Nombre mostrado<input id="displayName" placeholder="La Esquina"></label>
        <label>URL del logo<input id="logoUrl" type="url" placeholder="https://res.cloudinary.com/.../logo.png"></label>
        <label>Mensaje de bienvenida<input id="welcomeMessage" placeholder="Bienvenido"></label>
        <div class="actions actions-end"><button>Crear bar</button></div>
      </form>
      <p id="createMessage"></p>
    </section>
    <section class="card">
      <div class="bars-heading-row">
        <h2>Bares</h2>
        <div class="bars-toolbar" aria-label="Paginación de bares">
          <button id="bars-prev" type="button" class="secondary">Anterior</button>
          <span id="bars-page" class="muted" aria-live="polite">0 bares</span>
          <button id="bars-next" type="button" class="secondary">Siguiente</button>
        </div>
      </div>
      <div id="bars"></div>
    </section>

    <section class="card">
      <div class="bars-heading-row">
        <div>
          <h2>Auditoría administrativa</h2>
          <p class="muted">Cambios realizados desde el panel Master Admin.</p>
        </div>
        <div class="bars-toolbar" aria-label="Paginación de auditoría">
          <button id="audit-prev" type="button" class="secondary">Anterior</button>
          <span id="audit-page" class="muted" aria-live="polite">0 eventos</span>
          <button id="audit-next" type="button" class="secondary">Siguiente</button>
        </div>
      </div>
      <div id="audit-list" class="audit-list"></div>
    </section>
  </main>
</div>
<script src="/js/admin-dialog.js"></script>
<script src="/js/master-admin.js?v=20260919-edit5"></script>
</body>
</html>
