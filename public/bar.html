<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jukebox Digital - Pantalla del Bar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════════
       VARIABLES Y BASE
    ═══════════════════════════════════════════════════════════════ */
    :root {
      --bg-deep:       #050508;
      --bg-dark:       #0a0a0f;
      --bg-panel:      #0d0d16;
      --neon-pink:     #ff0055;
      --neon-cyan:     #00e5ff;
      --text-primary:  #f0f0f8;
      --text-muted:    #7070a0;
      --text-dim:      #404060;
      --border-dark:   rgba(255,255,255,0.06);
      --glow-pink:     0 0 8px rgba(255, 0, 85, 0.6), 0 0 20px rgba(255, 0, 85, 0.3);
      --glow-cyan:     0 0 8px rgba(0, 229, 255, 0.6), 0 0 20px rgba(0, 229, 255, 0.3);
      --font-display:  'Orbitron', sans-serif;
      --font-body:     'Rajdhani', sans-serif;
      --radius-sm:     6px;
      --radius-md:     12px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      padding: 12px; /* Margen de seguridad para TV (Overscan) */
    }

    /* ═══════════════════════════════════════════════════════════════
       LAYOUT PRINCIPAL (70% - 30%)
    ═══════════════════════════════════════════════════════════════ */
    .bar-layout {
      display: grid;
      grid-template-columns: 70% 30%;
      height: calc(100vh - 24px);
      width: 100%;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      border: 1px solid var(--border-dark);
    }

    /* ─── Panel Izquierdo: Video ──────────────────────────────── */
    .panel-video {
      display: flex;
      flex-direction: column;
      background: #000;
      border-right: 1px solid var(--border-dark);
      position: relative;
    }

    .top-instruction-bar {
      background: rgba(0, 0, 0, 0.9);
      padding: 15px 20px;
      text-align: center;
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--neon-cyan);
      text-shadow: var(--glow-cyan);
      border-bottom: 1px solid rgba(0, 229, 255, 0.3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      z-index: 10;
    }

    .video-wrapper {
      flex: 1;
      position: relative;
      background: radial-gradient(ellipse at center, #0d0d1a 0%, #050508 70%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .idle-text {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      animation: neonPulse 2.5s infinite;
    }

    .now-playing-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.9);
      border-top: 2px solid var(--neon-pink);
    }

    .np-title {
      font-family: var(--font-body);
      font-size: 2.8rem;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .np-mesa {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--neon-cyan);
      text-shadow: var(--glow-cyan);
      white-space: nowrap;
    }

    /* ─── Panel Derecho: Info, Cola y QR ──────────────────────── */
    .panel-info {
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      padding: 20px;
      gap: 15px;
      overflow: hidden;
    }

    .logo-text {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: var(--text-primary);
      text-shadow: var(--glow-cyan);
      text-align: center;
      margin-bottom: 10px;
    }

    .logo-text span {
      color: var(--neon-pink);
      text-shadow: var(--glow-pink);
    }

    /* ─── Sección de la Cola de Canciones (Barrido) ───────────── */
    .queue-section {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden; /* Oculta lo que sale del área visible */
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border-dark);
      border-bottom: 1px solid var(--border-dark);
      padding: 10px 0;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 0.15em;
      text-align: center;
    }

    .queue-wrapper {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      /* Animación de barrido */
      animation: barridoVertical 15s linear infinite;
      will-change: transform; /* Optimización GPU */
    }

    /* Pausa la animación si pasas el mouse (opcional, pero útil) y si está vacío */
    .queue-list:hover { animation-play-state: paused; }
    .queue-list:empty { animation: none; }

    @keyframes barridoVertical {
      0%   { transform: translateY(100%); }
      100% { transform: translateY(-100%); }
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-dark);
      border-left: 3px solid var(--neon-pink);
      border-radius: var(--radius-sm);
    }

    .queue-thumb {
      width: 60px;
      height: 45px;
      background: #222;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .queue-details {
      flex: 1;
      min-width: 0;
    }

    .queue-song-title {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }

    .queue-song-who {
      font-size: 1.1rem;
      color: var(--neon-cyan);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ─── Sección QR ──────────────────────────────────────────── */
    .qr-section {
      text-align: center;
      padding-top: 10px;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .bar-qr-img {
      max-height: 130px;
      object-fit: contain;
      border-radius: 8px;
      border: 3px solid rgba(255, 0, 85, 0.5);
      padding: 4px;
      background: white;
    }

    .qr-text {
      margin-top: 8px;
    }

    .qr-text strong {
      display: block;
      font-family: var(--font-display);
      font-size: 0.9rem;
      color: var(--neon-pink);
      letter-spacing: 0.1em;
    }

    /* Clase mágica para ocultar el QR */
    .oculto-dinamico {
      display: none !important;
    }

    /* Animaciones base */
    @keyframes neonPulse {
      0%, 100% { opacity: 1; text-shadow: var(--glow-cyan); }
      50%      { opacity: 0.5; text-shadow: none; }
    }
  </style>
</head>
<body>

  <div class="bar-layout">
    
    <div class="panel-video">
      <div class="top-instruction-bar">
        Escanea el código QR y pide tu canción
      </div>
      
      <div class="video-wrapper">
        <div class="idle-text">CYBER-JUKEBOX ACTIVADO</div>
      </div>

      <div class="now-playing-bar">
        <div class="np-title">Esperando peticiones...</div>
        <div class="np-mesa">Auto-DJ</div>
      </div>
    </div>

    <div class="panel-info">
      
      <div class="logo-text">NEON<span>CLUB</span></div>

      <div class="queue-section">
        <div class="section-title">En Fila</div>
        <div class="queue-wrapper">
          <div class="queue-list" id="queueList">
            </div>
        </div>
      </div>

      <div class="qr-section" id="qrSection">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://tubar.com" alt="QR Code" class="bar-qr-img">
        <div class="qr-text">
          <strong>¡PIDE TU CANCIÓN AQUÍ!</strong>
        </div>
      </div>

    </div>
  </div>

  <script>
    const queueList = document.getElementById('queueList');
    const qrSection = document.getElementById('qrSection');

    /**
     * Evalúa la cantidad de canciones en la lista.
     * Si hay 3 o más, oculta el QR para darle espacio al barrido.
     */
    function evaluarEspacioQR() {
      const cantidadCanciones = queueList.children.length;
      
      if (cantidadCanciones >= 3) {
        qrSection.classList.add('oculto-dinamico');
      } else {
        qrSection.classList.remove('oculto-dinamico');
      }
    }

    /**
     * SCRIPT DE SIMULACIÓN (Para que veas cómo funciona al abrir el HTML)
     * Elimina esto en tu proyecto real y reemplázalo con tu lógica de base de datos.
     */
    let contadorCanciones = 1;
    const cancionesDemo = [
      { titulo: "Blinding Lights - The Weeknd", mesa: "Mesa 04" },
      { titulo: "Cyberpunk 2077 Theme", mesa: "Barra Principal" },
      { titulo: "Daft Punk - Harder, Better...", mesa: "VIP 1" },
      { titulo: "Kavinsky - Nightcall", mesa: "Mesa 12" },
      { titulo: "Perturbator - Future Club", mesa: "Mesa 02" }
    ];

    function agregarCancionDemo() {
      // Tomamos una canción aleatoria para la demo
      const randomSong = cancionesDemo[Math.floor(Math.random() * cancionesDemo.length)];
      
      const itemHTML = `
        <div class="queue-item">
          <div class="queue-thumb"></div>
          <div class="queue-details">
            <div class="queue-song-title">${contadorCanciones}. ${randomSong.titulo}</div>
            <div class="queue-song-who">Pedido por: ${randomSong.mesa}</div>
          </div>
        </div>
      `;
      
      // Inyectar en el HTML
      queueList.insertAdjacentHTML('beforeend', itemHTML);
      contadorCanciones++;

      // ¡IMPORTANTE! Llamar a la validación del QR después de modificar la lista
      evaluarEspacioQR();
    }

    // Simulamos que entra una canción nueva cada 4 segundos (máximo 6 para la prueba)
    const intervaloSimulacion = setInterval(() => {
      agregarCancionDemo();
      if (contadorCanciones > 6) {
        clearInterval(intervaloSimulacion);
      }
    }, 4000);

  </script>
</body>
</html>
