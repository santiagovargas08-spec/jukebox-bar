<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 GENESIS 2.0</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    /* ─── Estilos de Video y Base ─────────── */
    .video-wrapper {
      position: relative;
      z-index: 999999 !important; 
      box-shadow: none !important; 
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .video-wrapper > div,
    #youtube-player {
      position: absolute !important;
      /* Se reemplaza inset por top/left/right/bottom para TV viejas */
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      filter: none !important;
      mix-blend-mode: normal !important;
      opacity: 1 !important;
      z-index: 999999 !important; 
    }

    #youtube-player iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      filter: none !important; 
    }

    #np-titulo {
      font-size: 1.2rem !important; 
    }

    .queue-section {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1; 
      position: relative;
    }

    #queue-list {
      display: flex;
      flex-direction: column;
      /* gap: 10px eliminado porque rompe el diseño en Smart TVs viejas */
      padding-bottom: 50px; 
    }

    /* Solución al gap: aplicar margen inferior a los items */
    .queue-item {
      margin-bottom: 10px;
    }

    .qr-oculto {
      display: none !important;
    }

    /* ─── ESTILOS: EFECTOS DE ETIQUETAS Y RESALTADO ─── */
    
    .badge-nueva {
      background: #00f0ff;
      color: #000;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      text-transform: uppercase;
      animation: parpadeo 1s infinite alternate;
      display: inline-block;
      vertical-align: middle;
    }

    @keyframes parpadeo { 
      from { opacity: 1; box-shadow: 0 0 8px #00f0ff; } 
      to { opacity: 0.4; box-shadow: none; } 
    }

    .resaltar-nueva {
      animation: flashBg 8s ease-out forwards;
    }

    @keyframes flashBg {
      0% { background-color: rgba(0, 240, 255, 0.5); transform: scale(1.03); border: 1px solid #00f0ff; }
      100% { background-color: transparent; transform: scale(1); border: 1px solid transparent; }
    }

    .badge-multiplicador {
      color: #ff0055;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(255, 0, 85, 0.8);
      margin-left: 5px;
    }
  </style>
</head>
<body class="bar-body">

  <div class="bar-layout">
    <div class="panel-video">
      <div class="top-instruction-bar">
        Elige la canción desde tu celular
      </div>
      <div class="video-wrapper">
        <div class="idle-screen" id="idle-screen">
          <div class="idle-icon">🎵</div>
          <div class="idle-text">Jukebox Digital</div>
          <div class="idle-sub">Escanea el QR y pide tu canción</div>
        </div>
        <div id="youtube-player"></div>
      </div>
      <div class="now-playing-bar">
        <span class="np-label">▶ REPRODUCIENDO</span>
        <span class="np-title" id="np-titulo">— Esperando canciones —</span>
        <span class="np-separator" id="np-sep" style="display:none">|</span>
        <span class="np-mesa"  id="np-nombre"></span>
      </div>
    </div>

    <div class="panel-info">
      <div class="bar-logo-section">
        <img src="GENESIS 2.0.png" alt="Logo del bar Genesis" class="bar-logo-img" style="filter: drop-shadow(0 0 15px #00f0ff);">
        <div class="logo-text" style="margin-top: 10px;">
          GENESIS<span style="color: #00f0ff; text-shadow: 0 0 10px #00f0ff;">2.0</span>
        </div>
      </div>

      <div class="neon-divider"></div>

      <div class="queue-section">
        <h3 class="section-title">
          <span class="neon-dot">◆</span> PRÓXIMAS EN FILA
        </h3>
        <div class="queue-list" id="queue-list">
          <div class="queue-empty" id="queue-empty">
            <p style="color: #00f0ff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);">🎵 La fila está vacía</p>
            <small style="color: #ffffff;">Escanea el QR para pedir</small>
          </div>
        </div>
      </div>

      <div class="qr-section" id="seccion-qr">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10px 0;">
          <img src="qr-genesis.png" alt="QR del Bar" class="bar-qr-img">
          <div class="qr-text" style="font-size: 1rem; color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.8); font-weight: bold; line-height: 1.4; margin-top: 12px;">
            PIDE TU CANCIÓN<br>DESDE TU CELULAR
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="notification-banner" id="notification-banner" aria-live="polite">
    <div class="notif-content">
      <span class="notif-icon">🎵</span>
      <div class="notif-text">
        <div class="notif-song" id="notif-song-name">Nombre del tema</div>
        <div class="notif-who">
          Pedido por: <span id="notif-quien">—</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    'use strict';

    // ─────────────────────────────────────────────────────────
    //  ESTADO LOCAL
    // ─────────────────────────────────────────────────────────
    let player       = null;  
    let playerReady  = false;  
    let pendingVideo = null;   
    let notifTimer   = null;   
    let lastVideoId  = null;
    let currentPlaybackId = null;
    let advanceSentForPlaybackId = null;
    let pendingVideoForce = false;
    let historialReproducidas = []; // 🔥 NUEVO: Historial local para Auto-DJ
    let isAutoDJ     = false;  

    // Variables para el control de la Cola y Barrido
    let totalCancionesAnterior = 0;
    let intervaloBarrido = null;
    let timeoutReinicio = null;
    let timeoutReproduccion = null;
    let tiempoDescanso = 30000; // 30 segundos de espera entre barridos

    const isEsclavo  = new URLSearchParams(window.location.search).has('esclavo');

    // Semillas AutoDJ (fallback si historial vacío)
    const semillasMix = [
      'nJ7rBzClyCg', 'Qk7rhW-SB1g', 'D14H7qE1Tq0', 'y9Q30K7xLko', 
      'c8mP91kZ9C8', 'Wj6HkY10Y9U', 'z_a9OvhN168', '5R-7E5u2t8U', 
      'wDeZiEZGS3Q', 'W0Wc3eQ0Y5k', 'lM0D-l3w-X0', 'R5j71wB27cE', 
      'a-H_h2v4O0I', 'ca48oMV59LU', 'TapXs54Ah3E', '2aD2hYg1_n8', 
      'eHhLzHofkE8', 'I_mQv7-QIfs', 'eM6A7gJ_U2Y', 'G8v7gBWe3c4'
    ];

    const socket = io({ reconnectionDelay: 1000 });

    // Mantener encendida la pantalla del TV cuando el navegador lo permita.
    // Screen Wake Lock requiere HTTPS y soporte del navegador; no sustituye
    // la configuración de ahorro de energía propia del televisor.
    let screenWakeLock = null;
    let wakeLockRequestInProgress = false;

    async function solicitarWakeLock() {
      if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      if (screenWakeLock && !screenWakeLock.released) return;
      if (wakeLockRequestInProgress) return;

      wakeLockRequestInProgress = true;
      try {
        screenWakeLock = await navigator.wakeLock.request('screen');
        console.log('[TV] Bloqueo de suspensión activado.');
        screenWakeLock.addEventListener('release', () => {
          console.warn('[TV] El sistema liberó el bloqueo de pantalla.');
          screenWakeLock = null;
        });
      } catch (error) {
        console.warn('[TV] No fue posible evitar la suspensión desde el navegador:', error.name, error.message);
        screenWakeLock = null;
      } finally {
        wakeLockRequestInProgress = false;
      }
    }

    // Intento automático y recuperación si el navegador vuelve a primer plano.
    solicitarWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') solicitarWakeLock();
    });
    window.addEventListener('pageshow', solicitarWakeLock);

    // Algunos navegadores de TV solo aceptan la solicitud tras interacción.
    // Una tecla del control remoto o clic vuelve a intentar activar el bloqueo.
    ['pointerdown', 'keydown', 'touchstart'].forEach(eventName => {
      document.addEventListener(eventName, solicitarWakeLock, { passive: true });
    });

    socket.on('estado_inicial', ({ cola, reproduciendo, historialReproducidas: hist }) => {
      if (hist && hist.length > 0) {
        historialReproducidas = hist;
      }
      actualizarCola(cola);
      if (reproduciendo) {
        cargarVideo(reproduciendo);
      } else {
        // El Auto-DJ ahora lo administra el servidor; la TV solo reproduce la cola.
        actualizarNowPlayingBar(null);
        mostrarIdleScreen(true);
      }
    });

    socket.on('cola_actualizada', ({ cola, reproduciendo }) => {
      actualizarCola(cola);
      if (reproduciendo) actualizarNowPlayingBar(reproduciendo);

      if (!reproduciendo) {
        // Esperar la tanda Auto-DJ que prepara el servidor.
        actualizarNowPlayingBar(null);
        mostrarIdleScreen(true);
      }
    });

    socket.on('nueva_reproduccion', (cancion) => {
      isAutoDJ = cancion && cancion.origen === 'autodj';
      cargarVideo(cancion, true);
      mostrarNotificacion(cancion);
    });

    // 🔥 NUEVO: Escuchar actualizaciones del historial
    socket.on('historial_actualizado', ({ historialReproducidas: hist }) => {
      if (hist && hist.length > 0) {
        historialReproducidas = hist;
        console.log('📜 Historial actualizado:', hist.length, 'canciones');
      }
    });

    // El servidor ya envía estado_inicial automáticamente tras cada
    // reconexión. No solicitarlo otra vez evita recargar el mismo video.
    socket.io.on('reconnect', (attempt) => {
      console.log(`Socket reconectado (intento ${attempt}).`);
    });

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('youtube-player', {
        height: '100%', width: '100%',
        playerVars: { autoplay: 1, controls: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, fs: 0, playsinline: 1, enablejsapi: 1 },
        events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange, onError: onPlayerError }
      });
    };

    function onPlayerReady(event) {
      playerReady = true;
      if (pendingVideo) {
        const video = pendingVideo;
        const force = pendingVideoForce;
        pendingVideo = null;
        pendingVideoForce = false;
        cargarVideo(video, force);
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        clearTimeout(timeoutReproduccion);
        if (!isEsclavo) {
          // Registrar el historial una sola vez por reproducción.
          if (player.getVideoData && player.getVideoData()) {
            const videoData = player.getVideoData();
            if (videoData.video_id) {
              socket.emit('cancion_terminada', {
                videoId: videoData.video_id,
                titulo: videoData.title || 'Desconocida',
                nombre: '(Registrada)'
              });
            }
          }

          solicitarSiguienteUnaVez('ended');
        }
      } else if (event.data === YT.PlayerState.PLAYING) {
        clearTimeout(timeoutReproduccion);
        mostrarIdleScreen(false);
        if (isAutoDJ && player.getVideoData) {
          const videoData = player.getVideoData();
          if (videoData && videoData.title) {
            actualizarNowPlayingBar({ titulo: videoData.title, nombre: '🔥 Auto-DJ (Mix personalizado)' });
          }
        }
      }
    }

    function solicitarSiguienteUnaVez(motivo) {
      if (isEsclavo || currentPlaybackId === null) return;

      const playbackKey = String(currentPlaybackId);
      if (advanceSentForPlaybackId === playbackKey) return;

      advanceSentForPlaybackId = playbackKey;
      socket.emit('siguiente_cancion', {
        playbackId: currentPlaybackId,
        motivo
      });
    }

    function onPlayerError(event) {
      if (isEsclavo) return;

      const failedPlaybackId = currentPlaybackId;
      setTimeout(() => {
        if (
          failedPlaybackId !== null &&
          String(currentPlaybackId) === String(failedPlaybackId)
        ) {
          solicitarSiguienteUnaVez(`player_error_${event.data}`);
        }
      }, 2000);
    }

    function cargarVideo(cancion, forzar = false) {
      if (!cancion || !cancion.videoId) return;

      if (!playerReady || !player || typeof player.loadVideoById !== 'function') {
        pendingVideo = cancion;
        pendingVideoForce = pendingVideoForce || forzar;
        return;
      }

      const playbackId =
        cancion.id !== undefined && cancion.id !== null
          ? cancion.id
          : cancion.videoId;
      const mismoPlayback =
        currentPlaybackId !== null &&
        String(currentPlaybackId) === String(playbackId);

      if (!forzar && mismoPlayback) {
        let estadoActual = null;

        if (typeof player.getPlayerState === 'function') {
          try {
            estadoActual = player.getPlayerState();
          } catch (error) {
            console.warn('No se pudo consultar el estado del reproductor.', error);
          }
        }

        const estadosActivos = [
          YT.PlayerState.PLAYING,
          YT.PlayerState.PAUSED,
          YT.PlayerState.BUFFERING,
          YT.PlayerState.CUED
        ];

        if (estadoActual === null || estadosActivos.indexOf(estadoActual) !== -1) {
          actualizarNowPlayingBar(cancion);
          mostrarIdleScreen(false);
          return;
        }
      }

      currentPlaybackId = playbackId;
      advanceSentForPlaybackId = null;
      lastVideoId = cancion.videoId;
      clearTimeout(timeoutReproduccion);
      player.loadVideoById({ videoId: cancion.videoId });
      const playbackEsperado = String(playbackId);
      timeoutReproduccion = setTimeout(() => {
        if (String(currentPlaybackId) !== playbackEsperado) return;
        let estado = null;
        try { estado = player && player.getPlayerState ? player.getPlayerState() : null; } catch (error) {}
        if (estado !== YT.PlayerState.PLAYING && estado !== YT.PlayerState.PAUSED) {
          console.warn('[PLAYER] Tiempo de espera agotado; se avanzará la cola.');
          solicitarSiguienteUnaVez('playback_timeout');
        }
      }, 25000);
      actualizarNowPlayingBar(cancion);
      mostrarIdleScreen(false);
    }

    // El Auto-DJ se genera en el servidor; el cliente solo reproduce la cola.

    function mostrarIdleScreen(visible) {
      const el = document.getElementById('idle-screen');
      if (el) el.style.display = visible ? 'flex' : 'none';
    }

    function actualizarNowPlayingBar(cancion) {
      const tituloEl = document.getElementById('np-titulo');
      const nombreEl = document.getElementById('np-nombre');
      const sepEl    = document.getElementById('np-sep');

      if (!cancion) {
        tituloEl.textContent  = '— Esperando canciones —';
        nombreEl.textContent  = '';
        sepEl.style.display   = 'none';
        return;
      }
      tituloEl.textContent = cancion.titulo;
      nombreEl.textContent = cancion.nombre;
      sepEl.style.display  = 'inline';
    }

    // ─────────────────────────────────────────────────────────
    //  NÚCLEO DE LA MAGIA VISUAL: BARRIDO Y AGRUPACIÓN
    // ─────────────────────────────────────────────────────────
    function actualizarCola(cola) {
      const listEl  = document.getElementById('queue-list');
      const emptyEl = document.getElementById('queue-empty');
      const qrSection = document.getElementById('seccion-qr'); 

      const hayCancionNueva = cola.length > totalCancionesAnterior;
      totalCancionesAnterior = cola.length;

      listEl.querySelectorAll('.queue-item').forEach(el => el.remove());

      if (cola && cola.length >= 4) {
        if (qrSection) qrSection.classList.add('qr-oculto');
      } else {
        if (qrSection) qrSection.classList.remove('qr-oculto');
      }

      if (!cola || cola.length === 0) {
        emptyEl.style.display = 'block';
        detenerCicloBarrido(listEl);
        return;
      }

      emptyEl.style.display = 'none';

      const colaAgrupada = [];
      cola.forEach(cancion => {
        let existente = colaAgrupada.find(c => c.videoId === cancion.videoId);
        if(existente) {
          existente.cantidad = (existente.cantidad || 1) + 1;
        } else {
          colaAgrupada.push({ ...cancion, cantidad: 1 });
        }
      });

      colaAgrupada.forEach((cancion, index) => {
        const item = document.createElement('div');
        item.className = 'queue-item';
        
        if (hayCancionNueva && index === colaAgrupada.length - 1) {
          item.classList.add('resaltar-nueva');
        }

        const thumbHtml = cancion.thumbnail
          ? `<img class="queue-thumb" src="${escapeHtml(cancion.thumbnail)}" alt="" loading="lazy" onerror="this.style.display='none'">`
          : `<div class="queue-thumb-placeholder">🎵</div>`;

        const multiplicadorHtml = cancion.cantidad > 1 
          ? `<span class="badge-multiplicador">(x${cancion.cantidad})</span>` 
          : '';

        const nuevaHtml = (hayCancionNueva && index === colaAgrupada.length - 1)
          ? `<span class="badge-nueva">¡Nueva!</span>`
          : '';

        item.innerHTML = `
          <div class="queue-num">${index + 1}</div>
          ${thumbHtml}
          <div class="queue-details">
            <div class="queue-song-title">
              ${escapeHtml(cancion.titulo)} ${multiplicadorHtml}
            </div>
            <div class="queue-song-who">
              Pedido por: ${escapeHtml(cancion.nombre)} ${nuevaHtml}
            </div>
          </div>
        `;
        listEl.appendChild(item);
      });

      // LÓGICA DE BARRIDO ACTUALIZADA (Solo si hay 8 o más)
      if (cola.length >= 8) {
        setTimeout(() => iniciarCicloBarrido(listEl, hayCancionNueva), 50);
      } else {
        detenerCicloBarrido(listEl);
      }
    }

    // Funciones de control del barrido inteligente con JS
    function iniciarCicloBarrido(listEl, forzarInmediato) {
      clearInterval(intervaloBarrido); 
      clearTimeout(timeoutReinicio);

      const ejecutarAnimacion = () => {
        const contenedor = listEl.parentElement;
        const alturaVisible = contenedor.offsetHeight;
        const alturaTotal = listEl.scrollHeight;
        
        if (alturaTotal > alturaVisible) {
          const distanciaScroll = alturaTotal - alturaVisible + 20;
          
          // 🧠 LÓGICA INTELIGENTE DE TIEMPO AJUSTADA
          const cantCanciones = listEl.children.length; 
          // Base de 5s. Si hay más de 10 canciones, suma medio segundo (0.5) por cada una adicional.
          const tiempoBarrido = cantCanciones > 10 ? 5 + ((cantCanciones - 10) * 0.5) : 5;
          const tiempoPausa = 2; // 2 segundos exactos detenida abajo para poder leerla perfectamente
          
          // 1. Reseteo instantáneo al inicio
          listEl.style.transition = 'none';
          listEl.style.transform = 'translateY(0)';
          clearTimeout(timeoutReinicio);

          // 2. Forzamos Reflow
          void listEl.offsetWidth; 

          // 3. Ejecutamos el barrido con el tiempo inteligente calculado
          listEl.style.transition = `transform ${tiempoBarrido}s linear`;
          listEl.style.transform = `translateY(-${distanciaScroll}px)`;

          // 4. Programamos el regreso contemplando el tiempo de bajada + la pausa de 2s
          timeoutReinicio = setTimeout(() => {
            listEl.style.transition = 'none';
            listEl.style.transform = 'translateY(0)';
          }, (tiempoBarrido + tiempoPausa) * 1000);
        }
      };

      if (forzarInmediato) {
        ejecutarAnimacion();
      }

      intervaloBarrido = setInterval(ejecutarAnimacion, tiempoDescanso);
    }

    function detenerCicloBarrido(listEl) {
      clearInterval(intervaloBarrido);
      clearTimeout(timeoutReinicio);
      listEl.style.transition = 'none';
      listEl.style.transform = 'translateY(0)';
    }

    function mostrarNotificacion(cancion) {
      if (!cancion) return;
      const banner   = document.getElementById('notification-banner');
      const songName = document.getElementById('notif-song-name');
      const quien    = document.getElementById('notif-quien');

      songName.textContent = cancion.titulo;
      quien.textContent    = cancion.nombre;

      banner.classList.remove('notif-show', 'notif-hide');
      void banner.offsetWidth;
      banner.classList.add('notif-show');

      clearTimeout(notifTimer);
      notifTimer = setTimeout(() => {
        banner.classList.remove('notif-show');
        banner.classList.add('notif-hide');
      }, 5000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const logoSection = document.querySelector('.bar-logo-section');
    if (logoSection) {
      logoSection.style.cursor = 'pointer'; 
      logoSection.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => console.error(err));
        } else {
          document.exitFullscreen();
        }
      });
    }

  </script>

  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
