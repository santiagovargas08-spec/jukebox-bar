<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 GENESIS 2.0</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    /* ─── Estilos de Video y Base ─────────── */
    .video-wrapper {
      position: relative;
      z-index: 999999 !important; 
      box-shadow: none !important; 
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .video-wrapper > div,
    #youtube-player {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      filter: none !important;
      mix-blend-mode: normal !important;
      opacity: 1 !important;
      z-index: 999999 !important; 
    }

    #youtube-player iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      filter: none !important; 
    }

    #np-titulo {
      font-size: 1.2rem !important; 
    }

    .queue-section {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1; 
      position: relative;
    }

    #queue-list {
      display: flex;
      flex-direction: column;
      padding-bottom: 10px; 
    }
    
    .queue-item {
      margin-bottom: 10px;
    }

    .qr-oculto {
      display: none !important;
    }

    /* ─── ESTILOS: EFECTOS DE ETIQUETAS Y RESALTADO ─── */
    .badge-nueva {
      background: #00f0ff;
      color: #000;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      text-transform: uppercase;
      display: inline-block;
      vertical-align: middle;
    }

    .badge-multiplicador {
      color: #ff0055;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(255, 0, 85, 0.8);
      margin-left: 5px;
    }
  </style>

  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed; top:0; left:0; width:100%; padding:20px; background:red; color:white; z-index:9999999; font-size:18px; font-weight:bold;';
      errDiv.innerHTML = '⚠️ ERROR EN TV: ' + msg + '<br>Línea: ' + lineNo;
      document.body.appendChild(errDiv);
      return false;
    };
  </script>
</head>
<body class="bar-body">

  <div class="bar-layout">
    <div class="panel-video">
      <div class="top-instruction-bar">
        Elige la canción desde tu celular
      </div>
      <div class="video-wrapper">
        <div class="idle-screen" id="idle-screen">
          <div class="idle-icon">🎵</div>
          <div class="idle-text">Jukebox Digital</div>
          <div class="idle-sub">Escanea el QR y pide tu canción</div>
        </div>
        <div id="youtube-player"></div>
      </div>
      <div class="now-playing-bar">
        <span class="np-label">▶ REPRODUCIENDO</span>
        <span class="np-title" id="np-titulo">— Esperando canciones —</span>
        <span class="np-separator" id="np-sep" style="display:none">|</span>
        <span class="np-mesa"  id="np-nombre"></span>
      </div>
    </div>

    <div class="panel-info">
      <div class="bar-logo-section" id="btn-fullscreen">
        <img src="GENESIS 2.0.png" alt="Logo del bar Genesis" class="bar-logo-img" style="filter: drop-shadow(0 0 15px #00f0ff);">
        <div class="logo-text" style="margin-top: 10px;">
          GENESIS<span style="color: #00f0ff; text-shadow: 0 0 10px #00f0ff;">2.0</span>
        </div>
      </div>

      <div class="neon-divider"></div>

      <div class="queue-section">
        <h3 class="section-title">
          <span class="neon-dot">◆</span> PRÓXIMAS EN FILA
        </h3>
        <div class="queue-list" id="queue-list">
          <div class="queue-empty" id="queue-empty">
            <p style="color: #00f0ff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);">🎵 La fila está vacía</p>
            <small style="color: #ffffff;">Escanea el QR para pedir</small>
          </div>
        </div>
      </div>

      <div class="qr-section" id="seccion-qr">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10px 0;">
          <img src="qr-genesis.png" alt="QR del Bar" class="bar-qr-img">
          <div class="qr-text" style="font-size: 1rem; color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.8); font-weight: bold; line-height: 1.4; margin-top:12px;">
            PIDE TU CANCIÓN<br>DESDE TU CELULAR
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="notification-banner" id="notification-banner">
    <div class="notif-content">
      <span class="notif-icon">🎵</span>
      <div class="notif-text">
        <div class="notif-song" id="notif-song-name">Nombre del tema</div>
        <div class="notif-who">
          Pedido por: <span id="notif-quien">—</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    // ─────────────────────────────────────────────────────────
    //  ESTADO LOCAL (Sin animaciones complejas ni barrido)
    // ─────────────────────────────────────────────────────────
    var player       = null;  
    var playerReady  = false;  
    var pendingVideo = null;   
    var notifTimer   = null;   
    var lastVideoId  = null;   
    var isAutoDJ     = false;  
    var totalCancionesAnterior = 0;

    var isEsclavo = window.location.search.indexOf('esclavo') !== -1;
    var pendingAutoDJ = false;

    var semillasMix = [
      'nJ7rBzClyCg', 'Qk7rhW-SB1g', 'D14H7qE1Tq0', 'y9Q30K7xLko', 
      'c8mP91kZ9C8', 'Wj6HkY10Y9U', 'z_a9OvhN168', '5R-7E5u2t8U', 
      'wDeZiEZGS3Q', 'W0Wc3eQ0Y5k', 'lM0D-l3w-X0', 'R5j71wB27cE', 
      'a-H_h2v4O0I', 'ca48oMV59LU', 'TapXs54Ah3E', '2aD2hYg1_n8', 
      'eHhLzHofkE8', 'I_mQv7-QIfs', 'eM6A7gJ_U2Y', 'G8v7gBWe3c4'
    ];
    var cancionSemilla = semillasMix[Math.floor(Math.random() * semillasMix.length)];

    var socket = io({ reconnectionDelay: 1000 });

    socket.on('estado_inicial', function (data) {
      actualizarCola(data.cola);
      if (data.reproduciendo) {
        cargarVideo(data.reproduciendo);
      } else {
        if (!isEsclavo) {
          lastVideoId = cancionSemilla; 
          if (playerReady) {
            iniciarAutoDJ();
          } else {
            pendingAutoDJ = true; 
          }
        } else {
          mostrarIdleScreen(true);
        }
      }
    });

    socket.on('cola_actualizada', function (data) {
      actualizarCola(data.cola);
      if (data.reproduciendo) {
        actualizarNowPlayingBar(data.reproduciendo);
      }

      if (!data.reproduciendo) {
        if (lastVideoId && !isAutoDJ) {
          if (!isEsclavo) iniciarAutoDJ();
        } else if (!lastVideoId && !isAutoDJ) {
          actualizarNowPlayingBar(null);
          mostrarIdleScreen(true);
        }
      }
    });

    socket.on('nueva_reproduccion', function (cancion) {
      isAutoDJ = false;
      cargarVideo(cancion);
      mostrarNotificacion(cancion);
    });

    socket.on('reconnect', function () {
      socket.emit('solicitar_estado');
    });

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('youtube-player', {
        height: '100%', width: '100%',
        playerVars: { autoplay: 1, controls: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, fs: 0, playsinline: 1, enablejsapi: 1 },
        events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange, onError: onPlayerError }
      });
    };

    function onPlayerReady(event) {
      playerReady = true;
      if (pendingVideo) {
        cargarVideo(pendingVideo);
        pendingVideo = null;
      } else if (pendingAutoDJ && !isEsclavo) {
        iniciarAutoDJ();
        pendingAutoDJ = false;
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        if (!isAutoDJ && !isEsclavo) {
          socket.emit('siguiente_cancion');
        }
      } else if (event.data === YT.PlayerState.PLAYING) {
        mostrarIdleScreen(false);
        if (isAutoDJ && player.getVideoData) {
          var videoData = player.getVideoData();
          if (videoData && videoData.title) {
            actualizarNowPlayingBar({ titulo: videoData.title, nombre: '🔥 Auto-DJ (YouTube Mix)' });
          }
        }
      }
    }

    function onPlayerError(event) {
      if (!isEsclavo) {
        setTimeout(function () {
          socket.emit('siguiente_cancion');
        }, 2000);
      }
    }

    function cargarVideo(cancion) {
      if (!cancion) return;
      if (!playerReady || !player || typeof player.loadVideoById !== 'function') {
        pendingVideo = cancion; return;
      }
      lastVideoId = cancion.videoId;
      player.loadVideoById({ videoId: cancion.videoId });
      actualizarNowPlayingBar(cancion);
      mostrarIdleScreen(false);
    }

    function iniciarAutoDJ() {
      if (!playerReady || !player) return;
      isAutoDJ = true;
      mostrarIdleScreen(false);
      player.loadPlaylist({ list: 'RD' + lastVideoId, listType: 'playlist' });
      actualizarNowPlayingBar({ titulo: 'Cargando selección musical...', nombre: '🔥 Auto-DJ' });
    }

    function mostrarIdleScreen(visible) {
      var el = document.getElementById('idle-screen');
      if (el) el.style.display = visible ? 'flex' : 'none';
    }

    function actualizarNowPlayingBar(cancion) {
      var tituloEl = document.getElementById('np-titulo');
      var nombreEl = document.getElementById('np-nombre');
      var sepEl    = document.getElementById('np-sep');

      if (!cancion) {
        tituloEl.textContent  = '— Esperando canciones —';
        nombreEl.textContent  = '';
        sepEl.style.display   = 'none';
        return;
      }
      tituloEl.textContent = cancion.titulo;
      nombreEl.textContent = cancion.nombre;
      sepEl.style.display  = 'inline';
    }

    function actualizarCola(cola) {
      var listEl  = document.getElementById('queue-list');
      var emptyEl = document.getElementById('queue-empty');
      var qrSection = document.getElementById('seccion-qr'); 

      var hayCancionNueva = cola.length > totalCancionesAnterior;
      totalCancionesAnterior = cola.length;

      var itemsActuales = listEl.querySelectorAll('.queue-item');
      for (var i = 0; i < itemsActuales.length; i++) {
        itemsActuales[i].parentNode.removeChild(itemsActuales[i]);
      }

      if (cola && cola.length >= 4) {
        if (qrSection) qrSection.className += ' qr-oculto';
      } else {
        if (qrSection) qrSection.className = qrSection.className.replace(' qr-oculto', '');
      }

      if (!cola || cola.length === 0) {
        emptyEl.style.display = 'block';
        return;
      }

      emptyEl.style.display = 'none';

      var colaAgrupada = [];
      for (var j = 0; j < cola.length; j++) {
        var cancion = cola[j];
        var existente = null;
        for (var k = 0; k < colaAgrupada.length; k++) {
          if (colaAgrupada[k].videoId === cancion.videoId) {
            existente = colaAgrupada[k];
            break;
          }
        }
        
        if (existente) {
          existente.cantidad = (existente.cantidad || 1) + 1;
        } else {
          var nuevaCancion = {};
          for (var key in cancion) {
            if (cancion.hasOwnProperty(key)) {
              nuevaCancion[key] = cancion[key];
            }
          }
          nuevaCancion.cantidad = 1;
          colaAgrupada.push(nuevaCancion);
        }
      }

      for (var idx = 0; idx < colaAgrupada.length; idx++) {
        var c = colaAgrupada[idx];
        var item = document.createElement('div');
        item.className = 'queue-item';

        var thumbHtml = c.thumbnail
          ? '<img class="queue-thumb" src="' + escapeHtml(c.thumbnail) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
          : '<div class="queue-thumb-placeholder">🎵</div>';

        var multiplicadorHtml = c.cantidad > 1 
          ? '<span class="badge-multiplicador">(x' + c.cantidad + ')</span>' 
          : '';

        var nuevaHtml = (hayCancionNueva && idx === colaAgrupada.length - 1)
          ? '<span class="badge-nueva">¡Nueva!</span>'
          : '';

        item.innerHTML = 
          '<div class="queue-num">' + (idx + 1) + '</div>' +
          thumbHtml +
          '<div class="queue-details">' +
            '<div class="queue-song-title">' +
              escapeHtml(c.titulo) + ' ' + multiplicadorHtml +
            '</div>' +
            '<div class="queue-song-who">' +
              'Pedido por: ' + escapeHtml(c.nombre) + ' ' + nuevaHtml +
            '</div>' +
          '</div>';
        
        listEl.appendChild(item);
      }
    }

    function mostrarNotificacion(cancion) {
      if (!cancion) return;
      var banner   = document.getElementById('notification-banner');
      var songName = document.getElementById('notif-song-name');
      var quien    = document.getElementById('notif-quien');

      songName.textContent = cancion.titulo;
      quien.textContent    = cancion.nombre;

      banner.className = banner.className.replace(' notif-show', '').replace(' notif-hide', '');
      void banner.offsetWidth;
      banner.className += ' notif-show';

      clearTimeout(notifTimer);
      notifTimer = setTimeout(function() {
        banner.className = banner.className.replace(' notif-show', '');
        banner.className += ' notif-hide';
      }, 5000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    var logoSection = document.getElementById('btn-fullscreen');
    if (logoSection) {
      logoSection.style.cursor = 'pointer'; 
      logoSection.addEventListener('click', function() {
        var doc = document.documentElement;
        var req = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
        
        if (!document.fullscreenElement && req) {
          try {
            var promise = req.call(doc);
            if (promise && promise.catch) {
              promise.catch(function(){}); 
            }
          } catch(e) {}
        } else if (document.exitFullscreen) {
          try { document.exitFullscreen(); } catch(e){}
        }
      });
    }

  </script>

  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
