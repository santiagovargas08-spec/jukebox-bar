<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 GENESIS 2.0</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    /* ─── Estilos adicionales específicos de bar.html ─────────── */

    /* ELEVAR EL VIDEO: Lo mantenemos en una capa alta y limpia de filtros */
    .video-wrapper {
      position: relative;
      z-index: 999999 !important; 
      box-shadow: none !important; 
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    /* Asegurar que el reproductor y el iframe no tengan filtros de color o mezcla */
    .video-wrapper > div,
    #youtube-player {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      filter: none !important;
      mix-blend-mode: normal !important;
      opacity: 1 !important;
      z-index: 999999 !important; 
    }

    #youtube-player iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      filter: none !important; 
    }

    /* Disminuir el tamaño de la letra de la canción que está sonando */
    #np-titulo {
      font-size: 1.2rem !important; 
    }

    /* ─── NUEVOS ESTILOS: BARRIDO Y QR (Agregados sin alterar lo anterior) ─── */
    .queue-section {
      overflow: hidden; /* Oculta las canciones que se salen del área */
      display: flex;
      flex-direction: column;
      flex: 1; /* Permite que tome el espacio vacío si el QR desaparece */
    }

    #queue-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .queue-list-animada {
      /* Animación de barrido suave de 15 segundos */
      animation: barridoVerticalTV 15s linear infinite;
    }

    @keyframes barridoVerticalTV {
      0% { transform: translateY(80%); }
      100% { transform: translateY(-100%); }
    }

    .qr-oculto {
      display: none !important;
    }
  </style>
</head>
<body class="bar-body">

  <div class="bar-layout">

    <div class="panel-video">
      
      <div class="top-instruction-bar">
        Elige la canción desde tu celular
      </div>
      
      <div class="video-wrapper">

        <div class="idle-screen" id="idle-screen">
          <div class="idle-icon">🎵</div>
          <div class="idle-text">Jukebox Digital</div>
          <div class="idle-sub">Escanea el QR y pide tu canción</div>
        </div>

        <div id="youtube-player"></div>
      </div>

      <div class="now-playing-bar">
        <span class="np-label">▶ REPRODUCIENDO</span>
        <span class="np-title" id="np-titulo">— Esperando canciones —</span>
        <span class="np-separator" id="np-sep" style="display:none">|</span>
        <span class="np-mesa"  id="np-nombre"></span>
      </div>
    </div>

    <div class="panel-info">

      <div class="bar-logo-section">
        <img src="GENESIS 2.0.png" alt="Logo del bar Genesis" class="bar-logo-img" style="filter: drop-shadow(0 0 15px #00f0ff);">
        <div class="logo-text" style="margin-top: 10px;">
          GENESIS<span style="color: #00f0ff; text-shadow: 0 0 10px #00f0ff;">2.0</span>
        </div>
      </div>

      <div class="neon-divider"></div>

      <div class="queue-section">
        <h3 class="section-title">
          <span class="neon-dot">◆</span> PRÓXIMAS EN FILA
        </h3>
        <div class="queue-list" id="queue-list">
          <div class="queue-empty" id="queue-empty">
            <p style="color: #00f0ff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);">🎵 La fila está vacía</p>
            <small style="color: #ffffff;">Escanea el QR para pedir</small>
          </div>
        </div>
      </div>

      <div class="qr-section" id="seccion-qr">
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 10px 0;">
          <img src="qr-genesis.png" alt="QR del Bar" class="bar-qr-img">
          <div class="qr-text" style="font-size: 1rem; color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.8); font-weight: bold; line-height: 1.4;">
            PIDE TU CANCIÓN<br>DESDE TU CELULAR
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="notification-banner" id="notification-banner" aria-live="polite">
    <div class="notif-content">
      <span class="notif-icon">🎵</span>
      <div class="notif-text">
        <div class="notif-song" id="notif-song-name">Nombre del tema</div>
        <div class="notif-who">
          Pedido por: <span id="notif-quien">—</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    'use strict';

    // ─────────────────────────────────────────────────────────
    //  ESTADO LOCAL
    // ─────────────────────────────────────────────────────────
    let player       = null;  
    let playerReady  = false;  
    let pendingVideo = null;   
    let notifTimer   = null;   

    let lastVideoId  = null;   
    let isAutoDJ     = false;  

    // Detectar si este TV es esclavo mirando la URL (?esclavo=true)
    const isEsclavo  = new URLSearchParams(window.location.search).has('esclavo');

    // Variables para arrancar el día con música
    let pendingAutoDJ = false;

    // 👇 Lista Maestra de Canciones para abrir el bar (Variado Colombiano) 👇
    const semillasMix = [
      // 🥃 MÚSICA POPULAR Y DESPECHO
      'nJ7rBzClyCg', // Jessi Uribe - Dulce Pecado
      'Qk7rhW-SB1g', // Yeison Jimenez - Aventurero
      'D14H7qE1Tq0', // Alzate - Maldita Traición
      'y9Q30K7xLko', // Luis Alberto Posada - Me Tomas y Me Dejas
      'c8mP91kZ9C8', // Darío Gómez - Nadie es Eterno
      'Wj6HkY10Y9U', // Pipe Bueno - Recostada en la Cama
      'z_a9OvhN168', // Arelys Henao - Señor Prohibido

      // 🪗 VALLENATO (Clásico y Nueva Ola)
      '5R-7E5u2t8U', // Diomedes Díaz - La Plata
      'wDeZiEZGS3Q', // Binomio de Oro - Me Ilusioné
      'W0Wc3eQ0Y5k', // Silvestre Dangond - Niégame Tres Veces
      'lM0D-l3w-X0', // Los Inquietos - Volver
      'R5j71wB27cE', // Patricia Teherán - Tarde lo Conocí
      'a-H_h2v4O0I', // Kaleth Morales - Vivo en el Limbo

      // 🔥 REGUETÓN Y URBANO
      'ca48oMV59LU', // Karol G - PROVENZA
      'TapXs54Ah3E', // J Balvin - Ay Vamos
      '2aD2hYg1_n8', // Feid - Normal
      'eHhLzHofkE8', // Ryan Castro - Mujeriego
      'I_mQv7-QIfs', // Blessd - Medallo

      // 🎺 SALSA Y TROPICAL (Para prender el ambiente)
      'eM6A7gJ_U2Y', // Grupo Niche - Cali Pachanguero
      'G8v7gBWe3c4'  // Joe Arroyo - La Rebelión
    ];
    
    // El sistema elige una canción al azar de la lista maestra cada vez que se abre la página
    const cancionSemilla = semillasMix[Math.floor(Math.random() * semillasMix.length)];

    // ─────────────────────────────────────────────────────────
    //  SOCKET.IO — Conexión al servidor Node.js
    // ─────────────────────────────────────────────────────────
    const socket = io({ reconnectionDelay: 1000 });

    // ── Recibir estado inicial (conexión o reconexión) ────────
    socket.on('estado_inicial', ({ cola, reproduciendo }) => {
      console.log('[Socket] Estado inicial → cola:', cola.length, '| reproduciendo:', reproduciendo?.titulo ?? 'nada');
      actualizarCola(cola);
      
      if (reproduciendo) {
        cargarVideo(reproduciendo);
      } else {
        // Si no hay música, el Maestro enciende el Auto-DJ de fondo
        if (!isEsclavo) {
          lastVideoId = cancionSemilla; 
          if (playerReady) {
            iniciarAutoDJ();
          } else {
            pendingAutoDJ = true; 
          }
        } else {
          // El esclavo solo muestra la pantalla de inicio y espera en silencio
          mostrarIdleScreen(true);
        }
      }
    });

    // ── Cola actualizada ──────────────────────────────────────
    socket.on('cola_actualizada', ({ cola, reproduciendo }) => {
      actualizarCola(cola);

      if (reproduciendo) {
        actualizarNowPlayingBar(reproduciendo);
      }

      // MAGIA AUTO-DJ: Si no hay canción reproduciendo (fila vacía)
      if (!reproduciendo) {
        if (lastVideoId && !isAutoDJ) {
          if (!isEsclavo) iniciarAutoDJ();
        } else if (!lastVideoId && !isAutoDJ) {
          actualizarNowPlayingBar(null);
          mostrarIdleScreen(true);
        }
      }
    });

    // ── Comenzar a reproducir una canción nueva ───────────────
    socket.on('nueva_reproduccion', (cancion) => {
      console.log('[Socket] Nueva reproducción:', cancion?.titulo);
      isAutoDJ = false;
      cargarVideo(cancion);
      mostrarNotificacion(cancion);
    });

    // ── Reconexión: pedir estado actualizado ──────────────────
    socket.on('reconnect', () => {
      console.log('[Socket] Reconectado — solicitando estado');
      socket.emit('solicitar_estado');
    });

    // ─────────────────────────────────────────────────────────
    //  YOUTUBE IFRAME API
    // ─────────────────────────────────────────────────────────
    window.onYouTubeIframeAPIReady = function () {
      console.log('[YT] IFrame API cargada — creando player');
      player = new YT.Player('youtube-player', {
        height: '100%',
        width:  '100%',
        playerVars: {
          autoplay:         1,   
          controls:         1,   
          rel:              0,   
          modestbranding:   1,   
          iv_load_policy:   3,   
          fs:               0,   
          playsinline:      1,   
          enablejsapi:      1    
        },
        events: {
          onReady:       onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError:       onPlayerError
        }
      });
    };

    function onPlayerReady(event) {
      console.log('[YT] Player listo para recibir comandos');
      playerReady = true;
      
      if (pendingVideo) {
        cargarVideo(pendingVideo);
        pendingVideo = null;
      } 
      // Si había un Auto-DJ pendiente por iniciar al cargar la página
      else if (pendingAutoDJ && !isEsclavo) {
        iniciarAutoDJ();
        pendingAutoDJ = false;
      }
    }

    function onPlayerStateChange(event) {
      switch (event.data) {
        case YT.PlayerState.ENDED:
          // Solo el maestro pide la siguiente canción
          if (!isAutoDJ && !isEsclavo) {
            console.log('[YT] Video de cliente terminado → siguiente_cancion');
            socket.emit('siguiente_cancion');
          }
          break;
          
        case YT.PlayerState.PLAYING:
          mostrarIdleScreen(false);
          if (isAutoDJ && player.getVideoData) {
            const videoData = player.getVideoData();
            if (videoData && videoData.title) {
              actualizarNowPlayingBar({
                titulo: videoData.title,
                nombre: '🔥 Auto-DJ (YouTube Mix)'
              });
            }
          }
          break;
          
        case YT.PlayerState.PAUSED:
          console.log('[YT] Video en pausa');
          break;
      }
    }

    function onPlayerError(event) {
      console.error('[YT] Error del player, código:', event.data);
      // Solo el maestro se salta el video si hay error
      if (!isEsclavo) {
        setTimeout(() => socket.emit('siguiente_cancion'), 2000);
      }
    }

    // ─────────────────────────────────────────────────────────
    //  FUNCIONES DE REPRODUCCIÓN
    // ─────────────────────────────────────────────────────────

    function cargarVideo(cancion) {
      if (!cancion) return;

      if (!playerReady || !player || typeof player.loadVideoById !== 'function') {
        pendingVideo = cancion;
        return;
      }

      lastVideoId = cancion.videoId;

      console.log('[YT] Cargando video:', cancion.videoId, '—', cancion.titulo);
      player.loadVideoById({ videoId: cancion.videoId });
      actualizarNowPlayingBar(cancion);
      mostrarIdleScreen(false);
    }

    function iniciarAutoDJ() {
      if (!playerReady || !player) return;

      console.log('[Auto-DJ] Iniciando mix infinito basado en:', lastVideoId);
      isAutoDJ = true;
      mostrarIdleScreen(false);

      player.loadPlaylist({
        list: 'RD' + lastVideoId,
        listType: 'playlist'
      });

      actualizarNowPlayingBar({
        titulo: 'Cargando selección musical...',
        nombre: '🔥 Auto-DJ'
      });
    }

    function mostrarIdleScreen(visible) {
      const el = document.getElementById('idle-screen');
      if (el) el.style.display = visible ? 'flex' : 'none';
    }

    // ─────────────────────────────────────────────────────────
    //  ACTUALIZAR BARRA "REPRODUCIENDO"
    // ─────────────────────────────────────────────────────────
    function actualizarNowPlayingBar(cancion) {
      const tituloEl = document.getElementById('np-titulo');
      const nombreEl = document.getElementById('np-nombre');
      const sepEl    = document.getElementById('np-sep');

      if (!cancion) {
        tituloEl.textContent  = '— Esperando canciones —';
        nombreEl.textContent  = '';
        sepEl.style.display   = 'none';
        return;
      }
      tituloEl.textContent = cancion.titulo;
      nombreEl.textContent = cancion.nombre;
      sepEl.style.display  = 'inline';
    }

    // ─────────────────────────────────────────────────────────
    //  ACTUALIZAR LISTA DE LA COLA (Modificada para Barrido y QR)
    // ─────────────────────────────────────────────────────────
    function actualizarCola(cola) {
      const listEl  = document.getElementById('queue-list');
      const emptyEl = document.getElementById('queue-empty');
      const qrSection = document.getElementById('seccion-qr'); // Variable para el QR

      listEl.querySelectorAll('.queue-item').forEach(el => el.remove());

      // Validación para ocultar el QR si hay 3 o más canciones
      if (cola && cola.length >= 3) {
        if (qrSection) qrSection.classList.add('qr-oculto');
      } else {
        if (qrSection) qrSection.classList.remove('qr-oculto');
      }

      if (!cola || cola.length === 0) {
        emptyEl.style.display = 'block';
        listEl.classList.remove('queue-list-animada'); // Apagamos el barrido
        return;
      }

      emptyEl.style.display = 'none';
      listEl.classList.add('queue-list-animada'); // Encendemos el barrido

      // Recorremos todas las canciones (se quitó el limitador de 4)
      cola.forEach((cancion, index) => {
        const item = document.createElement('div');
        item.className = 'queue-item';
        item.style.animationDelay = `${index * 0.08}s`;

        const thumbHtml = cancion.thumbnail
          ? `<img class="queue-thumb" src="${escapeHtml(cancion.thumbnail)}" alt="" loading="lazy" onerror="this.style.display='none'">`
          : `<div class="queue-thumb-placeholder">🎵</div>`;

        item.innerHTML = `
          <div class="queue-num">${index + 1}</div>
          ${thumbHtml}
          <div class="queue-details">
            <div class="queue-song-title">${escapeHtml(cancion.titulo)}</div>
            <div class="queue-song-who">${escapeHtml(cancion.nombre)} · ${escapeHtml(cancion.timestamp)}</div>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    // ─────────────────────────────────────────────────────────
    //  BANNER DE NOTIFICACIÓN ANIMADO
    // ─────────────────────────────────────────────────────────
    function mostrarNotificacion(cancion) {
      if (!cancion) return;

      const banner   = document.getElementById('notification-banner');
      const songName = document.getElementById('notif-song-name');
      const quien    = document.getElementById('notif-quien');

      songName.textContent = cancion.titulo;
      quien.textContent    = cancion.nombre;

      banner.classList.remove('notif-show', 'notif-hide');
      void banner.offsetWidth;
      banner.classList.add('notif-show');

      clearTimeout(notifTimer);
      notifTimer = setTimeout(() => {
        banner.classList.remove('notif-show');
        banner.classList.add('notif-hide');
      }, 5000);
    }

    // ─────────────────────────────────────────────────────────
    //  UTILIDAD: Escapar HTML para prevenir XSS
    // ─────────────────────────────────────────────────────────
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ─────────────────────────────────────────────────────────
    //  MODO PANTALLA COMPLETA (Clic en el logo)
    // ─────────────────────────────────────────────────────────
    const logoSection = document.querySelector('.bar-logo-section');
    if (logoSection) {
      logoSection.style.cursor = 'pointer'; 
      logoSection.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.error(`Error al intentar pantalla completa: ${err.message}`);
          });
        } else {
          document.exitFullscreen();
        }
      });
    }

  </script>

  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
