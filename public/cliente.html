<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ GENESIS 2.0 — Pide tu canción</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    /* 🎨 Tema Cyberpunk Cian (GENESIS 2.0) */
    :root {
      --neon-cyan: #00f0ff;
      --neon-glow: rgba(0, 240, 255, 0.5);
      --bg-dark: #050508;
      --panel-bg: rgba(15, 15, 25, 0.8);
    }
    
    body {
      background-color: var(--bg-dark);
      font-family: 'Rajdhani', sans-serif;
      color: #fff;
      padding: 15px;
      max-width: 500px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px dashed var(--neon-cyan);
      padding-bottom: 15px;
    }
    
    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-glow);
      margin: 0;
      letter-spacing: 2px;
    }
    .logo-text span { color: var(--neon-cyan); }
    
    .panel {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    label {
      display: block;
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-cyan);
      font-size: 0.9rem;
      margin-bottom: 5px;
    }
    
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      background: #0a0a0f;
      border: 1px solid var(--neon-cyan);
      color: #fff;
      border-radius: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus { box-shadow: 0 0 8px var(--neon-glow); }
    
    button.btn-neon {
      width: 100%;
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }
    button.btn-neon:hover, button.btn-neon:active {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--neon-glow);
    }
    
    /* Resultados */
    .resultado-item {
      display: flex;
      align-items: center;
      background: #11111e;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      border: 1px solid rgba(0, 240, 255, 0.1);
    }
    .thumb {
      width: 60px;
      height: 45px;
      object-fit: cover;
      border-radius: 4px;
      margin-right: 10px;
    }
    .info { flex: 1; }
    .titulo { font-weight: bold; font-size: 0.95rem; line-height: 1.2; margin-bottom: 5px; }
    
    .btn-pedir {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
    }
    .btn-pedir:active { background: var(--neon-cyan); color: #000; }
    
    .mensaje-sistema { text-align: center; color: #888; margin-top: 10px; font-size: 0.9rem; }
    .notificacion {
      color: var(--neon-cyan);
      text-align: center;
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      background: rgba(0, 240, 255, 0.1);
      display: none;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="logo-text">GENESIS <span>2.0</span></h1>
    <p style="color: #888; margin: 5px 0 0 0;">El control de la música es tuyo</p>
  </div>

  <div id="notificacion" class="notificacion">🎵 ¡Canción enviada a la pista!</div>

  <div class="panel">
    <label for="input-nombre">📍 TU NOMBRE / MESA</label>
    <input type="text" id="input-nombre" placeholder="Ej: Mesa 4 - Carlos" autocomplete="off">
  </div>

  <div class="panel">
    <label for="input-buscar">💿 BUSCAR CANCIÓN</label>
    <input type="text" id="input-buscar" placeholder="Artista o nombre de la canción..." autocomplete="off">
    <button class="btn-neon" id="btn-buscar">🔍 Buscar</button>
  </div>

  <div id="resultados">
    <div class="mensaje-sistema">Busca una canción para empezar la fiesta.</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    'use strict';

    const socket = io();

    // Elementos del DOM
    const inputNombre  = document.getElementById('input-nombre');
    const inputBuscar  = document.getElementById('input-buscar');
    const btnBuscar    = document.getElementById('btn-buscar');
    const boxResultados= document.getElementById('resultados');
    const notificacion = document.getElementById('notificacion');

    // ─────────────────────────────────────────────────────────
    // 🧠 MAGIA LOCALSTORAGE: Recuperar nombre al entrar
    // ─────────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      const nombreGuardado = localStorage.getItem('genesis_cliente_nombre');
      if (nombreGuardado) {
        inputNombre.value = nombreGuardado;
      }
    });

    // ─────────────────────────────────────────────────────────
    // BUSCADOR
    // ─────────────────────────────────────────────────────────
    btnBuscar.addEventListener('click', () => {
      const q = inputBuscar.value.trim();
      if (q) {
        boxResultados.innerHTML = '<div class="mensaje-sistema">⏳ Buscando en YouTube...</div>';
        socket.emit('buscar_canciones', q);
      }
    });

    inputBuscar.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnBuscar.click();
    });

    // Recibir resultados del servidor
    socket.on('resultados_busqueda', ({ items }) => {
      if (!items || items.length === 0) {
        boxResultados.innerHTML = '<div class="mensaje-sistema">No se encontraron resultados.</div>';
        return;
      }

      boxResultados.innerHTML = items.map(item => `
        <div class="resultado-item">
          <img class="thumb" src="${item.thumbnail}" onerror="this.style.display='none'">
          <div class="info">
            <div class="titulo">${escapeHtml(item.title)}</div>
          </div>
          <button class="btn-pedir" 
            data-id="${escapeHtml(item.videoId)}" 
            data-title="${escapeHtml(item.title)}" 
            data-thumb="${escapeHtml(item.thumbnail)}">
            + PEDIR
          </button>
        </div>
      `).join('');

      // Evento para los botones "PEDIR"
      document.querySelectorAll('.btn-pedir').forEach(btn => {
        btn.addEventListener('click', () => {
          const nombreUsuario = inputNombre.value.trim();
          
          if (!nombreUsuario) {
            alert('⚠️ Por favor, ingresa tu nombre o número de mesa antes de pedir una canción.');
            inputNombre.focus();
            return;
          }

          // 🧠 MAGIA LOCALSTORAGE: Guardar/Actualizar nombre en el celular del cliente
          localStorage.setItem('genesis_cliente_nombre', nombreUsuario);

          // Enviar la canción al servidor
          socket.emit('agregar_cancion', {
            videoId:   btn.dataset.id,
            titulo:    btn.dataset.title,
            nombre:    nombreUsuario,
            thumbnail: btn.dataset.thumb
          });

          // Limpiar búsqueda y mostrar éxito
          inputBuscar.value = '';
          boxResultados.innerHTML = '<div class="mensaje-sistema">¡Excelente elección! Sigue buscando más música.</div>';
          mostrarNotificacion();
        });
      });
    });

    socket.on('error_busqueda', () => {
      boxResultados.innerHTML = '<div class="mensaje-sistema" style="color: #ff0055;">Hubo un error al buscar. Intenta de nuevo.</div>';
    });

    // Utilidad: Mostrar mensaje de éxito temporal
    function mostrarNotificacion() {
      notificacion.style.display = 'block';
      setTimeout(() => {
        notificacion.style.display = 'none';
      }, 3000);
    }

    // Utilidad: Seguridad básica contra inyección HTML
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
