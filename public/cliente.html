<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#0a0a0f">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>🎵 GENESIS 2.0 Pide tu canción</title>


  <!-- ============================================================
       FUENTES
  ============================================================ -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap"
    rel="stylesheet"
  >


  <!-- ============================================================
       CSS PRINCIPAL
  ============================================================ -->

  <link
    rel="stylesheet"
    href="style.css"
  >


  <!-- ============================================================
       ESTILOS DE LA COLA
  ============================================================ -->

  <link rel="stylesheet" href="/css/cliente.css">

</head>


<body class="cliente-body">


  <!-- ============================================================
       HEADER
  ============================================================ -->

  <header
    class="cliente-header cliente-header-stack"
    role="banner"
  >

    <img
      src="GENESIS 2.0.png"
      alt="Logo Genesis 2.0"
      class="cliente-logo-img"
    >

    <div
      class="header-logo header-logo-compact"
    >
      GENESIS<span>2.0</span>
    </div>

    <div class="header-tagline">
      Pide tu canción
    </div>

  </header>


  <!-- ============================================================
       CONTENIDO PRINCIPAL
  ============================================================ -->

  <main
    class="cliente-main"
    role="main"
  >


    <!-- ========================================================
         IDENTIDAD DEL CLIENTE
    ======================================================== -->

    <div class="identity-card card">

      <label
        class="campo-label campo-label-bright"
        for="input-nombre"
      >
        Tu nombre o número de mesa
      </label>

      <input
        type="text"
        id="input-nombre"
        class="campo-input"
        placeholder="Ej: Mesa 5 · Ana García"
        maxlength="30"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
        spellcheck="false"
      >

    </div>


    <!-- ========================================================
         BUSCADOR
    ======================================================== -->

    <div class="search-card card">

      <label
        class="campo-label campo-label-bright"
        for="input-buscar"
      >
        ¿Qué quieres escuchar?
      </label>


      <div class="search-box">

        <input
          type="search"
          id="input-buscar"
          class="campo-input"
          placeholder="Artista, canción, género..."
          maxlength="100"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="search"
        >


        <button
          class="btn-search"
          id="btn-buscar"
          aria-label="Buscar en YouTube"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            width="20"
            height="20"
            aria-hidden="true"
          >

            <circle
              cx="11"
              cy="11"
              r="8"
            />

            <line
              x1="21"
              y1="21"
              x2="16.65"
              y2="16.65"
            />

          </svg>

        </button>

      </div>

    </div>


    <!-- ========================================================
         LOADING
    ======================================================== -->

    <div
      class="loading-state is-hidden"
      id="loading-state"
      role="status"
      aria-live="polite"
    >

      <div
        class="loading-spinner"
        aria-hidden="true"
      ></div>

      <span>
        Buscando sin límites...
      </span>

    </div>


    <!-- ========================================================
         ERROR
    ======================================================== -->

    <div
      class="error-state card is-hidden"
      id="error-state"
      role="alert"
    >

      <span id="error-message">
        Error al buscar.
      </span>

    </div>


    <!-- ========================================================
         RESULTADOS
    ======================================================== -->

    <section
      class="results-section is-hidden"
      id="results-section"
      aria-label="Resultados de búsqueda"
    >

      <div class="results-title">

        Resultados para:
        <span id="results-query"></span>

      </div>


      <div
        class="results-list"
        id="results-list"
        role="list"
      ></div>

    </section>


    <!-- ========================================================
         COLA EN VIVO
    ======================================================== -->

    <div
      class="live-queue-card card is-hidden"
      id="live-queue-section"
    >

      <h3
        class="section-title-sm section-title-sm-bright"
      >

        <span class="neon-dot">
          ◆
        </span>

        EN LA FILA AHORA

      </h3>


      <div
        id="live-queue-list"
        role="list"
      ></div>

    </div>

  </main>


  <!-- ============================================================
       OVERLAY CANCIÓN AÑADIDA
  ============================================================ -->

  <div
    class="success-overlay"
    id="success-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Canción añadida"
  >

    <div class="success-card">

      <div
        class="success-icon"
        aria-hidden="true"
      >
        🎵
      </div>


      <div class="success-title">
        ¡CANCIÓN AÑADIDA!
      </div>


      <div
        class="success-song"
        id="success-song-name"
      ></div>


      <div class="success-sub">

        Tu canción está en la fila.
        <br>

        ¡Disfruta la noche en GENESIS
        <span class="success-brand-accent">
          2.0
        </span>
        ! 🎉

      </div>


      <button
        class="btn-primary"
        id="btn-success-close"
      >
        ➕ Pedir otra canción
      </button>

    </div>

  </div>


  <!-- ============================================================
       SOCKET.IO
  ============================================================ -->

  <script src="/js/dom-safe.js"></script>
  <script src="/js/bar-loader.js"></script>
  <script src="/socket.io/socket.io.js"></script>


  <script src="/js/cliente.js"></script>

</body>

</html>
