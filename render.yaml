services:
  - type: web
    name: jukebox-bar
    runtime: node
    plan: starter
    nodeVersion: 20
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx --no-install prisma migrate deploy && npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jukebox-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: ENABLE_LEGACY_COMMERCIAL_API
        value: "false"
      - key: ENABLE_BEARER_ADMIN_AUTH
        value: "false"
      - key: OPERATOR_TOKEN_SECRET
        generateValue: true
      - key: MASTER_ADMIN_TOKEN_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: YOUTUBE_SEARCH_TIMEOUT_MS
        value: "4500"
      - key: PORT
        value: "3000"

databases:
  - name: jukebox-db
    plan: basic-256mb
    databaseName: jukebox
    user: jukebox
