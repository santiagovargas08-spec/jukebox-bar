name: Master Admin checks

on:
  push:
    branches: [comercializacion]
  pull_request:
    branches: [comercializacion]

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jukebox
          POSTGRES_PASSWORD: jukebox_test
          POSTGRES_DB: jukebox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jukebox -d jukebox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://jukebox:jukebox_test@127.0.0.1:5432/jukebox_test
      TEST_DATABASE_URL: postgresql://jukebox:jukebox_test@127.0.0.1:5432/jukebox_test
      OPERATOR_TOKEN_SECRET: test-operator-secret-0123456789-abcdef
      MASTER_ADMIN_TOKEN_SECRET: test-master-secret-0123456789-abcdefghi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - name: Audit repository secrets
        run: node scripts/audit-secrets.js

      - name: Audit deployment configuration
        run: node scripts/audit-deploy-config.js

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit (runtime)
        run: npm run audit:dependencies

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply test database migrations
        run: npx prisma migrate deploy

      - name: Syntax check
        run: npm run check:syntax

      - name: Audit public frontend
        run: npm run audit:public

      - name: Focused security and unit tests
        run: >-
          node --test
          tests/security.test.js
          tests/security-headers.test.js
          tests/youtube-search.test.js
          tests/song-request-policy.test.js
          tests/search-request-policy.test.js
          tests/socket-connection-policy.test.js
          tests/operator-action-policy.test.js
          tests/socket-state-request-policy.test.js
          tests/operator-auth-http.test.js
          tests/config-validation.test.js
          tests/rate-limit-store.test.js
          tests/bar-urls.test.js
          tests/bar-slug.test.js
          tests/cookies.test.js
          tests/advisory-locks.test.js
          tests/master-admin-cookie.test.js
          tests/origin-validation.test.js
          tests/qr-service.test.js
          tests/public-api-rate-limit.test.js
          tests/request-id.test.js
          tests/http-access-log.test.js
          tests/logger.test.js
          tests/admin-audit.test.js tests/audit-retention.test.js
          tests/bar-access.test.js
          tests/error-handler.test.js
          tests/promise-timeout.test.js
          tests/service-lifecycle.test.js
          tests/legacy-auth.test.js
          tests/license.test.js
          tests/master-dashboard-service.test.js

      - name: Run full integration test suite
        run: timeout 180s npm test
