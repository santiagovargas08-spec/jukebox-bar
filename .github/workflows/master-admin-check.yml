name: Master Admin checks

on:
  push:
    branches: [comercializacion]
  pull_request:
    branches: [comercializacion]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jukebox
          POSTGRES_PASSWORD: jukebox_test
          POSTGRES_DB: jukebox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jukebox -d jukebox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://jukebox:jukebox_test@127.0.0.1:5432/jukebox_test
      TEST_DATABASE_URL: postgresql://jukebox:jukebox_test@127.0.0.1:5432/jukebox_test
      OPERATOR_TOKEN_SECRET: test-operator-secret-0123456789-abcdef
      MASTER_ADMIN_TOKEN_SECRET: test-master-secret-0123456789-abcdefghi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Dependency audit (high/critical)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Run test database migrations
        run: npx prisma migrate deploy
      - run: node --check server.js
      - run: node --check routes/public.js
      - run: node --check services/barService.js
      - run: node --check services/licenseService.js
      - run: node --check services/queueService.js
      - run: node --check services/historyService.js
      - run: node --check services/masterAdminAuthService.js
      - run: node --check services/operatorAuthService.js
      - run: node --check services/youtubeSearchService.js
      - run: node --check services/songRequestPolicy.js
      - run: node --check services/barAccessService.js
      - run: node --check services/socketStateService.js
      - run: node --check socket/playbackAdminHandlers.js
      - run: node --check socket/publicHandlers.js
      - run: node --check lib/socketBar.js
      - run: node --check lib/rateLimitStore.js
      - run: node --check lib/urlValidation.js
      - run: node --check lib/securityHeaders.js
      - run: node --check lib/configValidation.js
      - run: node --check lib/barUrls.js
      - run: node --check public/js/operator-auth.js
      - run: node --check public/js/admin.js
      - run: node --check public/js/bar.js
      - run: node --check public/js/cliente.js
      - run: node --check public/js/master-admin.js
      - run: node scripts/audit-public-html.js
      - run: node --test tests/security.test.js tests/security-headers.test.js tests/youtube-search.test.js tests/song-request-policy.test.js tests/operator-auth-http.test.js tests/config-validation.test.js tests/rate-limit-store.test.js tests/bar-urls.test.js
      - run: node --check middleware/masterAdminAuth.js
      - run: node --check middleware/operatorAuth.js
      - run: node --check create-master-admin.js
      - name: Run full integration test suite
        run: npm test
