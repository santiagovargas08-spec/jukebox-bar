name: Master Admin checks

on:
  push:
    branches: [comercializacion]
  pull_request:
    branches: [comercializacion]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Dependency audit (high/critical)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npx prisma validate
      - run: npx prisma generate
      - run: node --check server.js
      - run: node --check routes/public.js
      - run: node --check services/barService.js
      - run: node --check services/licenseService.js
      - run: node --check services/masterAdminAuthService.js
      - run: node --check services/operatorAuthService.js
      - run: node --check services/youtubeSearchService.js
      - run: node --check services/songRequestPolicy.js
      - run: node --check services/barAccessService.js
      - run: node --check services/socketStateService.js
      - run: node --check lib/socketBar.js
      - run: node --check lib/rateLimitStore.js
      - run: node --check lib/securityHeaders.js
      - run: node --check lib/configValidation.js
      - run: node --check public/js/operator-auth.js
      - run: node --check public/js/admin.js
      - run: node --check public/js/bar.js
      - run: node --check public/js/cliente.js
      - run: node --check public/js/master-admin.js
      - run: node scripts/audit-public-html.js
      - run: node --test tests/security.test.js tests/security-headers.test.js tests/youtube-search.test.js tests/song-request-policy.test.js tests/operator-auth-http.test.js tests/config-validation.test.js tests/rate-limit-store.test.js
      - run: node --check middleware/masterAdminAuth.js
      - run: node --check middleware/operatorAuth.js
      - run: node --check create-master-admin.js
